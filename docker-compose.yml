services:
  # 1. PostgreSQL Database
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-inference_platform}
    volumes:
      - ai-inference-platform-sdd_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inference_platform}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 2. Redis Cache
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 2. FastAPI Backend
  api-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-backend
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-db:5432/inference_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis-cache:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ./backend/app:/backend/app
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend-network
      - backend-network

  # 3. React/Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      api-backend:
        condition: service_healthy
    networks:
      - frontend-network
  # 4. Ollama LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # For GPU acceleration, uncomment the section below (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - backend-network

  # 5. Ollama Model Puller (runs once, then exits)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Pulling gemma2:2b-instruct-q4_K_M..."
        ollama pull gemma2:2b-instruct-q4_K_M
        echo "Pulling llama3.2:3b-instruct-q4_K_M..."
        ollama pull llama3.2:3b-instruct-q4_K_M
        echo "All models pulled successfully!"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  ai-inference-platform-sdd_postgres_data:
    external: true
  ollama_data:
