apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: ai-platform
  labels:
    # This label causes Grafana's sidecar to auto-load this as a datasource
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true
        jsonData:
          derivedFields:
            - matcherRegex: '"model":"([^"]+)"'
              name: Model
              url: ''
