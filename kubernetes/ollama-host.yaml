apiVersion: v1
kind: Service
metadata:
  name: ollama-host-service
  namespace: ai-platform
  labels:
    app: ollama-host
spec:
  ports:
    - name: metrics
      port: 11434
      targetPort: 11434
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-host-service
  namespace: ai-platform
subsets:
  - addresses:
      - ip: 10.0.2.2 # Standard gateway IP for Minikube/Kind. Update if Docker Desktop or manual bridge is used.
    ports:
      - name: metrics
        port: 11434
        protocol: TCP
