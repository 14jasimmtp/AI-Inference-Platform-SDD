apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-host-monitor
  namespace: ai-platform
  labels:
    release: prometheus-stack # Matches the default helm release name of the prometheus-stack
    app: ollama-host
spec:
  selector:
    matchLabels:
      app: ollama-host
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
