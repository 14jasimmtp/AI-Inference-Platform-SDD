apiVersion: 1

datasources:
  # ── Prometheus (default metrics source) ──────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      exemplarTraceIdDestinations: []

  # ── Loki (log aggregation source) ────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      # Link Loki log lines to Prometheus metrics using the 'app' label
      derivedFields:
        - matcherRegex: '"model":"([^"]+)"'
          name: Model
          url: ''
